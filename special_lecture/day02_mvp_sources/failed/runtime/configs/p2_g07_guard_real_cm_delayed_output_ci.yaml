# CI-only genuine Nav2 CM output (raw) -> delay-only relay -> actual AXIA Guard.
# NOT deployed. No Gazebo or Goal. Synthetic scan at 0.62m activates the
# frozen P2 SlowFront zone; zones and 30% slowdown ratio are unchanged.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_supervised
    cmd_vel_out_topic: /axia_ci/cm_raw
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 0.5
    stop_pub_timeout: 2.0
    base_shift_correction: false
    polygons: [AXIA_StopFront, AXIA_SlowFront]
    AXIA_StopFront:
      type: polygon
      points: "[[0.40, 0.32], [0.40, -0.32], [-0.10, -0.32], [-0.10, 0.32]]"
      action_type: stop
      min_points: 4
      enabled: true
      visualize: false
    AXIA_SlowFront:
      type: polygon
      points: "[[0.75, 0.40], [0.75, -0.40], [-0.10, -0.40], [-0.10, 0.40]]"
      action_type: slowdown
      slowdown_ratio: 0.30
      min_points: 4
      enabled: true
      visualize: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      enabled: true
