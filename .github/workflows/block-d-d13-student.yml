name: AXIA D13 Student TODO Packaging L0 (expected algorithm RED)
on:
  push:
    branches: [feat/block-d-d13-reachability-lab-20261121]
  pull_request:
    branches: [main]
    paths:
      - 'block_D/day13/**'
      - '.github/workflows/block-d-d13-student.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-published-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check no runtime control dependencies and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile block_D/day13/reachability_student.py block_D/day13/run_lab.py
          if grep -E '^[[:space:]]*(import rclpy|from rclpy|import rospy|from geometry_msgs)' block_D/day13/*.py; then
            echo 'D13_FORBIDDEN_ROS_DEPENDENCY' >&2; exit 1
          fi
          test -f block_D/day13/STUDENT_LAB_GUIDE_KO.md
          test -f block_D/day13/STUDENT_WORKSHEET_KO.md
          test -f block_D/release/RELEASE_MANIFEST.json
      - name: Verify exact two expected student REDs (not unexpected errors)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 -m unittest discover -s block_D/day13/tests -p 'test_*.py' -v > "$RUNNER_TEMP/d13_red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/d13_red.log"
          test "$rc" -eq 1
          grep -q 'Ran 10 tests' "$RUNNER_TEMP/d13_red.log"
          grep -q 'FAILED (failures=2)' "$RUNNER_TEMP/d13_red.log"
          grep -q 'FAIL: test_P_same_time_overlap' "$RUNNER_TEMP/d13_red.log"
          grep -q 'FAIL: test_N_same_path_different_time' "$RUNNER_TEMP/d13_red.log"
          echo 'AXIA_D13_STUDENT_TODO_EXPECTED_RED_PN=PASS'
      - name: Verify CLI/HTML packaging and two expected unimplemented outcomes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 block_D/day13/run_lab.py --list --out "$RUNNER_TEMP/d13"
          set +e
          python3 block_D/day13/run_lab.py --out "$RUNNER_TEMP/d13" > "$RUNNER_TEMP/d13_cli.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/d13_cli.log"
          test "$rc" -eq 2
          grep -q 'D13_STUDENT_RESULT=RED_EXPECTED_TODO' "$RUNNER_TEMP/d13_cli.log"
          python3 - "$RUNNER_TEMP/d13/d13_results.json" <<'PY'
          import json, pathlib, sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert len(x["cases"])==8
          assert sum(c["pass"] for c in x["cases"])==6
          assert {c["id"] for c in x["cases"] if not c["pass"]}=={"P_same_time_overlap","N_same_route_different_time"}
          assert all(c["scope"]=="SYNTHETIC_OFFLINE_L0_NOT_ROS_OR_GAZEBO" for c in x["cases"])
          print("D13_STUDENT_JSON_8_CASES_EXPECTED_TWO_RED_PASS")
          PY
          test -f "$RUNNER_TEMP/d13/P_same_time_overlap.html"
          test -f "$RUNNER_TEMP/d13/N_same_route_different_time.html"
          echo 'D13_STUDENT_SCAFFOLD_PUBLIC_L0_PASS=1 NO_ROS_GAZEBO_GOAL=1'
