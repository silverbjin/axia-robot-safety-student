name: AXIA Block C D10 student demo and lab docs L0
on:
  push:
    branches: ['docs/d10-*']
    paths: ['block_C/day10/*.md', 'block_C/tests/test_d10_guides_contract.py', '.github/workflows/block-c-d10-student-guides.yml']
  pull_request:
    paths: ['block_C/day10/*.md', 'block_C/tests/test_d10_guides_contract.py', '.github/workflows/block-c-d10-student-guides.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-student-guides:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Verify fixed synthetic fixture, D10 public docs, student scaffold and intentional TODO RED
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/student_sha.log
          python3 block_C/fixtures/generator.py --check --fixture-dir block_C/fixtures | tee evidence/fixture.log
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q block_C/tests/test_d10_guides_contract.py \
            --junitxml=evidence/d10_guides.xml | tee evidence/d10_guides.log
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q block_C/tests/test_block_c_scaffold_contract.py \
            --junitxml=evidence/scaffold.xml | tee evidence/scaffold.log
          set +e
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q block_C/tests/test_student_task_expected_red.py \
            > evidence/todo_red.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q '4 failed' evidence/todo_red.log
          echo D10_STUDENT_TODO_EXPECTED_RED_4_CONFIRMED | tee evidence/verdict.log
          echo D10_STUDENT_DOCS_L0_PASS_ROS_NOT_RUN_GAZEBO_NOT_RUN | tee -a evidence/verdict.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d10-student-guides-l0-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
