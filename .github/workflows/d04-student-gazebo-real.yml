name: D04 student PUBLIC actual Gazebo Harmonic -> camera -> YOLO

on:
  push:
    branches: ['feature/d04-student-gazebo-yolo-20261112']
    paths:
      - 'block_B/day04/run_student_gazebo_yolo_once.sh'
      - 'block_B/day04/gazebo_yolo/**'
      - '.github/workflows/d04-student-gazebo-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gazebocamera-yolo-real-sensors:
    # No secret, no private instructor or cloud runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DOMAIN_ID: '40'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real Jazzy Nav2/Gazebo/bridge/GUI and build tools
        shell: bash
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl xz-utils python3-colcon-common-extensions \
            ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-turtlebot3-gazebo ros-jazzy-ros-gz \
            ros-jazzy-image-view ros-jazzy-xacro ros-jazzy-rviz2 \
            libgl1-mesa-dri xvfb xauth x11-utils
          source /opt/ros/jazzy/setup.bash
          ros2 pkg prefix nav2_minimal_tb3_sim
          ros2 pkg prefix turtlebot3_gazebo
          ros2 pkg prefix ros_gz_image
          bash -n block_B/day04/run_student_gazebo_yolo_once.sh
          python3 -m py_compile block_B/day04/gazebo_yolo/prepare_scene.py \
             block_B/day04/gazebo_yolo/verify_live.py
      - name: Run REAL Gazebo Harmonic sensors and upstream YOLO ONNX (PUBLIC)
        shell: bash
        run: |
          set -eo pipefail
          # Run Xvfb for Gazebo OGRE sensors, with GUI disabled in CI.
          mkdir -p "$RUNNER_TEMP/home"
          export HOME="$RUNNER_TEMP/home"
          export AXIA_D04_STUDENT_CI_HEADLESS=1
          export AXIA_D04_STUDENT_GUI=0
          export AXIA_D04_STUDENT_MONITOR_TIMEOUT_S=190
          LOG="$RUNNER_TEMP/d04-student-gazebo-real.log"
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=TERM --kill-after=20s 1100s \
            bash block_B/day04/run_student_gazebo_yolo_once.sh --run \
            > "$LOG" 2>&1
          RC=$?
          set -e
          tail -n 100 "$LOG"
          if [[ "$RC" != 0 ]]; then
            echo "D04_PUBLIC_REAL_GAZEBO_YOLO_BLOCKED rc=$RC"
            find "$HOME/axia_d04_student_evidence" -type f -name '*.log' -maxdepth 4 \
              -print -exec sh -c 'tail -n 35 "$1"' _ {} \; || true
            exit 1
          fi
          grep -F 'D04_STUDENT_GAZEBO_YOLO_LIVE_PASS' "$LOG"
          echo 'D04_PUBLIC_REAL_GAZEBO_CAMERA_YOLO_PASS HEADLESS_XVFB'
          echo 'D04_USER_WSL2_ACTUAL_GUI=NOT_CHECKED'
      - name: Run real Gazebo GUI and YOLO image window under Xvfb (PUBLIC GUI smoke)
        shell: bash
        run: |
          set -eo pipefail
          export HOME="$RUNNER_TEMP/home"
          export AXIA_D04_STUDENT_CI_HEADLESS=1
          export AXIA_D04_STUDENT_GUI=1
          export AXIA_D04_STUDENT_GUI_HOLD_S=45
          export AXIA_D04_STUDENT_MONITOR_TIMEOUT_S=160
          export QT_QPA_PLATFORM=xcb
          LOG="$RUNNER_TEMP/d04-student-gui.log"
          WINDOWS="$RUNNER_TEMP/d04-student-x11-windows.txt"
          export LOG WINDOWS
          xvfb-run -a -s '-screen 0 1530x900x24' bash -c '
            set -eo pipefail
            timeout --signal=TERM --kill-after=20s 300s \
              bash block_B/day04/run_student_gazebo_yolo_once.sh --run > "$LOG" 2>&1 &
            PID=$!
            found=0
            for i in $(seq 1 100); do
              sleep 2
              if grep -q "D04_STUDENT_GUI_HOLD_STARTED" "$LOG"; then
                found=1
                break
              fi
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
            done
            xwininfo -root -tree > "$WINDOWS" 2>&1 || true
            echo "=== Actual X11 windows seen during GUI_DEMO_HOLD ==="
            grep -Ei "Gazebo|gz sim|image_view|yolo|debug|Camera" "$WINDOWS" | tail -n 35 || true
            wait "$PID"
            if [[ "$found" != 1 ]]; then
              echo "D04_PUBLIC_GAZEBO_GUI_HOLD_NOT_REACHED"
              exit 1
            fi
          '
          tail -n 45 "$LOG"
          grep -q 'D04_STUDENT_GAZEBO_YOLO_LIVE_PASS' "$LOG"
          if grep -Eiq 'Gazebo|gz sim' "$WINDOWS" &&
             grep -Eiq 'image_view|yolo|debug_image' "$WINDOWS"; then
            echo 'D04_PUBLIC_XVFB_GAZEBO_AND_YOLO_GUI_WINDOWS_PASS'
          else
            echo 'D04_PUBLIC_XVFB_GUI_WINDOWS_UNVERIFIED'
            exit 1
          fi
          echo 'D04_USER_WSL2_WSLG_SCREEN=NOT_CHECKED'
      - name: Remove third-party model and actor (never upload licensed assets)
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/home/.cache/axia/d04/assets" || true
