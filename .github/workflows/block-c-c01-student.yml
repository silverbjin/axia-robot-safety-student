name: AXIA Block C C01 student data L0
on:
  push:
    branches: ['feat/block-c-c01-*']
    paths: ['block_C/**', '.github/workflows/block-c-c01-student.yml']
  pull_request:
    paths: ['block_C/**', '.github/workflows/block-c-c01-student.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - name: Independent student C01 fixture and test proof
        shell: bash
        run: |
          set -euo pipefail
          bash block_C/scripts/c01_fixture_once.sh --doctor
          bash block_C/scripts/c01_fixture_once.sh --check
          test ! -d block_C/instructor
          test ! -d block_C/hidden_tests
          echo C01_STUDENT_L0_VERIFIED_NO_ROS
