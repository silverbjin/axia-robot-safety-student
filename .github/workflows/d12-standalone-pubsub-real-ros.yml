name: D12 standalone pubsub real ROS Jazzy
on:
  pull_request:
    branches: [main]
    paths:
      - 'block_C/day12/standalone_pubsub/**'
      - '.github/workflows/d12-standalone-pubsub-real-ros.yml'
  push:
    branches: ['feat/d12-standalone-pubsub-lab', main]
    paths:
      - 'block_C/day12/standalone_pubsub/**'
      - '.github/workflows/d12-standalone-pubsub-real-ros.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d12-l0-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
        working-directory: block_C/day12/standalone_pubsub
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -eo pipefail
          apt-get update -qq -o APT::Update::Error-Mode=any
          apt-get install -y -qq --no-install-recommends python3-colcon-common-extensions python3-pytest ros-jazzy-rclpy ros-jazzy-std-msgs ros-jazzy-diagnostic-msgs
      - name: L0 Python regression
        run: |
          set -eo pipefail
          PYTHONPATH=src/axia_json_diagnostics python3 -m pytest -q tests src/axia_json_diagnostics/test
          python3 -m compileall -q src tests tools
          echo D12_STANDALONE_L0_PASS
      - name: Build packages and run actual DDS smoke
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select axia_basic_pubsub axia_json_diagnostics
          source install/setup.bash
          export ROS_DOMAIN_ID=87
          ros2 pkg executables axia_basic_pubsub
          ros2 pkg executables axia_json_diagnostics
          timeout --signal=TERM --kill-after=10s 100s python3 -u tools/ros_smoke.py
