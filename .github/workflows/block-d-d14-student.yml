  pull_request:
    branches: [main]
    paths: ['block_D/day14/**', '.github/workflows/block-d-d14-student.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-todo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
