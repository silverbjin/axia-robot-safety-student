name: Student TODO scaffold only (NOT behavior acceptance)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check TODO API exists, not the TODO solution
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -q tests/test_scaffold.py
          echo AXIA_STUDENT_TODO_INCOMPLETE_BY_DESIGN
