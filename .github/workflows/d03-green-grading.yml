name: D03 completed student code GREEN (not P1 acceptance)
on:
  push:
    branches:
      - 'work/d03-*'
      - 'submissions/d03-*'
      - 'student/d03-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python unit testing
        run: python -m pip install pytest==8.3.5
      - name: Detect forbidden instructor files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ('solution', 'hidden', 'private', 'credential', 'instructor')
          leaked = [str(p) for p in Path('block_A').rglob('*') if any(k in p.name.lower() for k in forbidden)]
          assert not leaked, leaked
          PY
      - name: Run completed student public tests (RED if incomplete)
        env:
          PYTHONPATH: block_A/day03
        run: |
          mkdir -p results
          python -m pytest -q \
            block_A/tests/test_safety_public.py \
            block_A/tests/test_d03_adapter_public.py \
            --junitxml=results/d03-green.xml
      - name: Upload public JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d03-public-junit
          path: results/d03-green.xml
          if-no-files-found: ignore
