name: D08 Gazebo RViz two-window YOLO-in-RViz NO-GOAL L2
on:
  pull_request:
    paths:
      - 'block_B/day08/run_d08_student_live_bootstrap.sh'
      - 'block_B/day08/run_d08_student_live_once.sh'
      - 'block_B/day08/live/**'
      - 'block_B/day04/run_student_gazebo_yolo_once.sh'
      - 'block_B/day05/gazebo_live/**'
      - '.github/workflows/d08-student-gazebo-rviz-l2.yml'
  push:
    branches: ['feat/d08-live-gazebo-rviz-no-goal-20261115']
    paths:
      - 'block_B/day08/run_d08_student_live_bootstrap.sh'
      - 'block_B/day08/run_d08_student_live_once.sh'
      - 'block_B/day08/live/**'
      - 'block_B/day04/run_student_gazebo_yolo_once.sh'
      - '.github/workflows/d08-student-gazebo-rviz-l2.yml'
permissions:
  contents: read
jobs:
  actual-public-mounted-rgbd-yolo-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Nested bootstrap must clone the exact PR head under test, not its old default branch.
      AXIA_D08_RELEASE_BRANCH: ${{ github.head_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install exact official D04 Jazzy/Gazebo/YOLO build runtime (PUBLIC)
        shell: bash
        run: |
          set -eo pipefail
          apt-get update -qq -o APT::Update::Error-Mode=any -o Acquire::Retries=1
          apt-get install -y -qq --no-install-recommends \
            git curl xz-utils python3-colcon-common-extensions \
            ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-turtlebot3-gazebo ros-jazzy-ros-gz \
            ros-jazzy-image-view ros-jazzy-xacro ros-jazzy-rviz2 \
            libgl1-mesa-dri xvfb xauth x11-utils
          # Reproduce the Owner's strict parent shell safely: source only with nounset OFF.
          set -u
          unset AMENT_TRACE_SETUP_FILES || true
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          echo D08_AMENT_TRACE_NOUNSET_SAFE_SOURCE_PASS
          ros2 pkg prefix nav2_minimal_tb3_sim
          ros2 pkg prefix turtlebot3_gazebo
          ros2 pkg prefix ros_gz_image
          bash -n block_B/day04/run_student_gazebo_yolo_once.sh
          bash -u block_B/day08/run_d08_student_live_bootstrap.sh --self-check
          bash -u block_B/day08/run_d08_student_live_once.sh --self-check
      - name: Prefetch verified Microsoft ONNX asset by GitHub REST (PUBLIC, before Gazebo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export HOME="$RUNNER_TEMP/home"
          python3 block_B/day04/gazebo_yolo/ci_onnxruntime_asset.py --fetch \
            "$HOME/.cache/axia/d04_student_gazebo/onnxruntime-linux-x64-1.20.0.tgz"
      - name: REAL Gazebo camera_link RGBD + moving human + upstream C++ YOLO and GUI windows
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/home"
          export HOME="$RUNNER_TEMP/home"
          export AXIA_D05_LIVE=1
          export AXIA_D05_SENSOR_ONLY=1
          export AXIA_D04_STUDENT_CI_HEADLESS=1
          export AXIA_D04_STUDENT_GUI=1
          export AXIA_D04_STUDENT_GUI_HOLD_S=35
          export AXIA_D08_HOLD_S=35
          export AXIA_D08_GUI_BACKEND=software
          export AXIA_D04_STUDENT_MONITOR_TIMEOUT_S=175
          export QT_QPA_PLATFORM=xcb
          LOG="$RUNNER_TEMP/d05-mounted-gazebo-real.log"
          WINDOWS="$RUNNER_TEMP/d05-x11-windows.txt"
          SCENE_GATE="$RUNNER_TEMP/d08-scene-pass.txt"
          export LOG WINDOWS SCENE_GATE
          xvfb-run -a -s '-screen 0 1530x900x24' bash -c '
            set -eo pipefail
            timeout --signal=TERM --kill-after=20s 1100s \
              bash block_B/day08/run_d08_student_live_bootstrap.sh --run > "$LOG" 2>&1 &
            PID=$!
            found=0
            for i in $(seq 1 100); do
              sleep 2
              if grep -q "D04_STUDENT_GUI_HOLD_STARTED" "$LOG"; then
                found=1
                break
              fi
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
            done
            # Probe same running Gazebo server/partition WHILE GUI is alive.
            # A 3D window PID is not evidence of Gazebo scene propagation.
            set +u
            source /opt/ros/jazzy/setup.bash
            set -u
            PARTITION="$(grep -oE "GZ_PARTITION=[^ ]+" "$LOG" | tail -n 1 | cut -d= -f2)"
            if [[ -z "$PARTITION" ]]; then
              echo "D08_GZ_SCENE_PARTITION_NOT_FOUND"; exit 1
            fi
            PROBE="$RUNNER_TEMP/d08-scene-topics.txt"
            for attempt in 1 2 3 4 5; do
              GZ_PARTITION="$PARTITION" timeout 12 gz topic -l > "$PROBE" 2>&1 || true
              if grep -Fxq "/world/default/pose/info" "$PROBE"; then
                echo D08_GZ_SCENE_BROADCASTER_POSE_GATE_PASS > "$SCENE_GATE"
                echo D08_GZ_SCENE_BROADCASTER_POSE_GATE_PASS
                break
              fi
              sleep 2
            done
            grep -Fxq "/world/default/pose/info" "$PROBE" || {
              echo "D08_GZ_SCENE_POSE_INFO_MISSING"; cat "$PROBE"; exit 1;
            }
            xwininfo -root -tree > "$WINDOWS" 2>&1 || true
            wait "$PID"
            if [[ "$found" != 1 ]]; then
              echo "D08_GAZEBO_RVIZ_GUI_HOLD_NOT_REACHED"; exit 1
            fi
          ' || {
            tail -n 110 "$LOG" || true
            find "$HOME/axia_d04_student_evidence" -maxdepth 3 \
              -type f -name '*.log' -print -exec sh -c 'tail -n 25 "$1"' _ {} \; || true
            exit 1
          }
          tail -n 95 "$LOG"
          grep -F 'D05_PUBLIC_SENSOR_ONLY_PASS' "$LOG"
          # D08 does NOT require image_view: YOLO image is observed
          # through the existing read-only RViz panel. Verify both 3D windows.
          if grep -Eiq 'Gazebo|gz sim' "$WINDOWS" &&
             grep -Eiq 'rviz' "$WINDOWS"; then
            echo 'D08_GAZEBO_RVIZ_TWO_WINDOWS_PASS'
          else
            echo 'D08_PUBLIC_TWO_GUI_WINDOWS_NOT_CONFIRMED'
            grep -Ei 'Gazebo|gz sim|rviz' "$WINDOWS" || true
            exit 1
          fi
          grep -F 'D08_DEBUG_IMAGE_WINDOW_SKIPPED RVIZ_YOLO_DEBUG_IMAGE_ENABLED' "$LOG"
          if grep -Fq 'D04_STUDENT_PROCESS_STARTED name=image_view ' "$LOG" ||
             grep -Eiq 'image_view' "$WINDOWS"; then
            echo 'D08_IMAGE_VIEW_PROCESS_FORBIDDEN'
            exit 1
          fi
          echo 'D08_IMAGE_VIEW_PROCESS_FORBIDDEN_CHECK_PASS'
          echo 'D08_RTF_PERFORMANCE_NOT_VERIFIED'
          grep -F 'D08_STUDENT_LIVE_LAUNCH_REQUESTED' "$LOG"
          [[ -s "$SCENE_GATE" ]] || {
            echo D08_GZ_SCENE_GATE_ARTIFACT_MISSING; exit 1;
          }
          grep -F 'D08_GZ_SCENE_BROADCASTER_POSE_GATE_PASS' "$SCENE_GATE"
          grep -F 'D08_RVIZ_OFFICIAL_MESH_VIEW_READY' "$LOG"
          grep -F "D08_STUDENT_RELEASE_SOURCE_SHA=$EXPECTED_SOURCE_SHA" "$LOG"
          grep -F 'D08_STUDENT_RVIZ_CONFIG=' "$LOG"
          if grep -Eiq 'rviz' "$WINDOWS"; then
            echo 'D08_RVIZ2_ACTUAL_X11_WINDOW_PASS'
          EVIDENCE="$(sed -n 's/^D04_STUDENT_EVIDENCE=//p' "$LOG" | tail -n 1)"
          if [[ -z "$EVIDENCE" || ! -f "$EVIDENCE/rviz2.log" ]]; then
            echo D08_RVIZ_LOG_MISSING; exit 1
          fi
          if grep -E 'Could not load resource .*nav2_minimal_tb3_sim/models/' "$EVIDENCE/rviz2.log"; then
            echo D08_RVIZ_UNRESOLVED_OFFICIAL_MESHES; exit 1
          fi
          echo D08_RVIZ_MESH_RESOURCE_ERRORS_NONE_PASS
          else
            echo 'D08_RVIZ2_X11_WINDOW_NOT_CONFIRMED'
            tail -n 120 "$WINDOWS" || true
            exit 1
          fi
          echo 'D08_STUDENT_GAZEBO_YOLO_RVIZ_GUI_L2_PASS_NO_GOAL'
          echo 'D08_STUDENT_RVIZ_D05_ROS_TOPICS_VERIFIED_BY_EXISTING_D05_MONITOR'
          echo 'D05_PRIVATE_DISTANCE_OBSERVER=NOT_RUN'
          echo 'D08_OWNER_WSL2_GUI=NOT_RUN'
      - name: Remove third-party model and actor from CI workspace
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/home/.cache/axia/d04/assets" || true
          echo 'MODEL_WEIGHTS_NOT_PUBLISHED'
