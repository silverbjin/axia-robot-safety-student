name: D03 v3 actual ROS 2 Jazzy + Gazebo Harmonic P1 Waffle smoke
on:
  push:
    branches: [D03_v3]
    paths:
      - '.github/workflows/d03-v3-ros-gazebo-smoke.yml'
      - 'ros2_ws/src/**'
      - 'block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py'
      - 'block_A/day03/v3/scripts/classroom.py'
      - 'scripts/p1_d03_v3_student_setup.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d03-v3-real-ros-gazebo
  cancel-in-progress: true
jobs:
  actual-p1-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      AXIA_D03_V3_CI_SIM_ONLY: 'YES'
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout exact student branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Student documented --install-deps: official Jazzy, Harmonic, Nav2, Waffle
        shell: bash
        run: |
          set -eo pipefail
          # Use exactly the student-facing install command, not duplicated apt rules.
          bash scripts/p1_d03_v3_student_setup.sh --install-deps
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          ros2 pkg prefix nav2_bringup
          ros2 pkg prefix nav2_minimal_tb3_sim
          ros2 pkg prefix ros_gz_sim
          gz sim --versions || gz sim --help | head -20
          python3 -m py_compile block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py
      - name: Student documented --prepare / --check: real five-package colcon build
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          mkdir -p results/d03-v3-ros-gazebo
          # Exercise the exact documented student command: session + colcon + preflight.
          bash scripts/p1_d03_v3_student_setup.sh --prepare \
            2>&1 | tee results/d03-v3-ros-gazebo/colcon.log
          bash scripts/p1_d03_v3_student_setup.sh --check
          set +u
          source install/setup.bash
          set -u
          for pkg in axia_safety_bringup axia_safety_supervisor axia_fault_injector axia_scenario_verifier axia_d3_demo; do
            ros2 pkg prefix "$pkg"
          done
          ros2 pkg executables axia_d3_demo
          echo D03_V3_REAL_ROS2_COLCON_BUILD_PASS
      - name: Actual headless P1 Gazebo Waffle sensors and D3 moving proxy
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          python3 block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py \
            --out results/d03-v3-ros-gazebo --timeout 350
      - name: Upload logs and explicit no-Goal/no-Fault verdict even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d03-v3-actual-ros2-gazebo
          path: results/d03-v3-ros-gazebo/
          if-no-files-found: warn
          retention-days: 21
