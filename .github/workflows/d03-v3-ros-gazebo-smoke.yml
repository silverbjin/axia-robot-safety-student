name: D03 v3 actual ROS 2 Jazzy + Gazebo Harmonic P1 Waffle smoke
on:
  push:
    branches: [D03_v3]
    paths:
      - '.github/workflows/d03-v3-ros-gazebo-smoke.yml'
      - 'ros2_ws/src/**'
      - 'block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py'
      - 'block_A/day03/v3/scripts/classroom.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d03-v3-real-ros-gazebo
  cancel-in-progress: true
jobs:
  actual-p1-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      AXIA_D03_V3_CI_SIM_ONLY: 'YES'
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout exact student branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official Jazzy, Harmonic, Nav2 and Waffle (ONCE)
        shell: bash
        run: |
          set -eo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            procps python3 python3-pytest python3-yaml \
            python3-colcon-common-extensions \
            ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-ros-gz ros-jazzy-ros2cli \
            ros-jazzy-nav2-msgs ros-jazzy-diagnostic-msgs
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          ros2 pkg prefix nav2_bringup
          ros2 pkg prefix nav2_minimal_tb3_sim
          ros2 pkg prefix ros_gz_sim
          gz sim --versions || gz sim --help | head -20
          python3 -m py_compile block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py
      - name: Actual colcon build of five shared P1 and D3 packages
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          mkdir -p results/d03-v3-ros-gazebo
          colcon build --base-paths ros2_ws/src --symlink-install \
            --packages-select axia_safety_bringup axia_safety_supervisor axia_fault_injector \
              axia_scenario_verifier axia_d3_demo \
            --event-handlers console_direct+ \
            2>&1 | tee results/d03-v3-ros-gazebo/colcon.log
          set +u
          source install/setup.bash
          set -u
          for pkg in axia_safety_bringup axia_safety_supervisor axia_fault_injector axia_scenario_verifier axia_d3_demo; do
            ros2 pkg prefix "$pkg"
          done
          ros2 pkg executables axia_d3_demo
          echo D03_V3_REAL_ROS2_COLCON_BUILD_PASS
      - name: Actual headless P1 Gazebo Waffle sensors and D3 moving proxy
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          python3 block_A/day03/v3/scripts/ci_ros_gazebo_smoke.py \
            --out results/d03-v3-ros-gazebo --timeout 350
      - name: Upload logs and explicit no-Goal/no-Fault verdict even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d03-v3-actual-ros2-gazebo
          path: results/d03-v3-ros-gazebo/
          if-no-files-found: warn
          retention-days: 21
