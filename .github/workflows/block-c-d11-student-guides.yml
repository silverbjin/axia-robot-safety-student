name: AXIA Block C D11 public student guides and MSE L0
on:
  push:
    branches: ['docs/d11-*']
    paths:
      - 'block_C/day11/**'
      - 'block_C/tests/test_d11_guides_contract.py'
      - '.github/workflows/block-c-d11-student-guides.yml'
  pull_request:
    paths:
      - 'block_C/day11/**'
      - 'block_C/tests/test_d11_guides_contract.py'
      - '.github/workflows/block-c-d11-student-guides.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d11-student-public-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public fixture and educational MSE contract only (no private instructor)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/sha.log
          python3 block_C/fixtures/generator.py --check --fixture-dir block_C/fixtures | tee evidence/fixture.log
          python3 -m unittest discover -s block_C/tests -p test_d11_guides_contract.py -v 2>&1 | tee evidence/tests.log
          python3 block_C/day11/mse_toy_practice.py | tee evidence/mse.log
          python3 -m py_compile block_C/day11/mse_toy_practice.py block_C/tests/test_d11_guides_contract.py
          echo D11_STUDENT_PUBLIC_DOCS_L0_PASS_TODO_EXPECTED_RED_PRIVATE_AE_NOT_RUN_ROS_GAZEBO_NOT_RUN | tee evidence/verdict.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d11-student-public-l0-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
