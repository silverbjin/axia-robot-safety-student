name: AXIA D06 G07 stop-ack versus native gz exit0 L0
on:
  push:
    branches: ['fix/d06-nogoal-gz-server-shutdown-drain-20261121']
    paths:
      - '.github/workflows/d06-nogoal-gz-server-exit-drain-l0.yml'
      - 'block_B/tests/test_d06_gz_server_shutdown_race.py'
      - 'block_B/day07/h01_runtime/tools/g07_gazebo_server_exit_guard.sh'
      - 'block_B/day07/h01_runtime/scripts/p2_no_goal_smoke_ci.sh'
  pull_request:
    paths:
      - '.github/workflows/d06-nogoal-gz-server-exit-drain-l0.yml'
      - 'block_B/tests/test_d06_gz_server_shutdown_race.py'
      - 'block_B/day07/h01_runtime/tools/g07_gazebo_server_exit_guard.sh'
      - 'block_B/day07/h01_runtime/scripts/p2_no_goal_smoke_ci.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l0-no-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test exact checkout and bounded subprocess exit proof
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n block_B/day07/h01_runtime/scripts/p2_no_goal_smoke_ci.sh
          python3 -m unittest discover -s block_B/tests -p test_d06_gz_server_shutdown_race.py -v
          echo 'D06_GAZEBO_STOP_DRAIN_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL'
